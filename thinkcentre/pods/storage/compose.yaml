services: 
  syncthing:
    image: docker.io/linuxserver/syncthing:latest
    container_name: syncthing
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
      - STGUIADDRESS=0.0.0.0:${SYNCTHING_UI_PORT}
    volumes:
      - ./syncthing/config:/config:Z
      - ${SYNCTHING_DATA_PATH}:/var/sync:Z
    ports:
      - "${SYNCTHING_UI_PORT}:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    restart: always
    tmpfs:
      - /tmp:size=50M
      - /run:size=50M
    logging:
      driver: journald

  sftpgo:
    image: docker.io/drakkan/sftpgo:latest
    container_name: sftpgo
    restart: always
    ports:
      - "${FILEBROWSER_PORT}:8080"
    environment:
      - TZ=${TZ}
      - SFTPGO_COMMON__UMASK=002
    volumes:
      - ${FILEBROWSER_ROOT}:/srv:rw
      - ./sftpgo/data:/var/lib/sftpgo:Z
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: journald
