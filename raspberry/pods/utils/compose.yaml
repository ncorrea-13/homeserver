services:
  uptime-kuma:
    image: docker.io/louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: always
    network_mode: host
    ports:
      - "${UPTIME_KUMA_PORT}:3001"
    volumes:
      - ./uptime-kuma-data:/app/data
      - ${PODMAN_SOCKET}:/var/run/docker.sock:ro
    security_opt:
      - label=disable
    logging:
      driver: journald

  homelab-status-api:
    build: ./homelab-status
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    container_name: homelab-status-api
    restart: unless-stopped
    ports:
      - "0.0.0.0:${STATUS_PORT}:8080"
    volumes:
      - homelab-status-data:/data
    environment:
      - WEBHOOK_SECRET_FILE=/run/secrets/webhook_secret
      - DB_PATH=/data/status.db
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
    secrets:
      - webhook_secret

volumes:
  homelab-status-data:

secrets:
  webhook_secret:
    external: true
